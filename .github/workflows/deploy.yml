name: Deploy to Cloudflare Pages

# main への push と手動実行で、Cloudflare Pages へ配信する。
# 必要なシークレット（値はこのファイルに書かない。登録はメイン側が行う）:
#   CLOUDFLARE_API_TOKEN   Cloudflare API トークン
#                          （Account: Cloudflare Pages = Edit、Zone re-x.info: DNS = Edit / Zone = Read）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare アカウント ID
# 未登録の間はデプロイのステップが失敗する（登録待ちの状態）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: scam-blocker-site
      CUSTOM_DOMAIN: scam-blocker.re-x.info
      ZONE_NAME: re-x.info
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install wrangler
        run: npm install -g wrangler@3

      # プロジェクトが無ければ作る（既にある場合はそのまま進む）
      - name: Create Pages project (if missing)
        run: |
          wrangler pages project create "$PAGES_PROJECT" --production-branch=main \
            || echo "project already exists (or create failed); continue to deploy"

      - name: Deploy dist/ to Cloudflare Pages
        run: wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main

      # カスタムドメインの割り当て。ゾーンが同じアカウントにあれば、
      # Pages 側へドメインを足し、CNAME（scam-blocker -> <project>.pages.dev）を用意する。
      - name: Assign custom domain
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          ZONE_ID="$(curl -fsS -H "$AUTH" "$API/zones?name=$ZONE_NAME" | jq -r '.result[0].id')"
          echo "zone: $ZONE_NAME ($ZONE_ID)"

          # Pages プロジェクトへカスタムドメインを追加（既にある場合は API がエラーを返すので読み飛ばす）
          curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains" \
            -d "{\"name\":\"$CUSTOM_DOMAIN\"}" \
            | jq -r '"pages domain: " + (.success|tostring) + " " + ((.errors // []) | map(.message) | join("; "))'

          # CNAME が無ければ作る（scam-blocker.re-x.info -> scam-blocker-site.pages.dev、プロキシ有効）
          HOST="${CUSTOM_DOMAIN%%.*}"
          EXISTS="$(curl -fsS -H "$AUTH" "$API/zones/$ZONE_ID/dns_records?type=CNAME&name=$CUSTOM_DOMAIN" | jq -r '.result | length')"
          if [ "$EXISTS" = "0" ]; then
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/zones/$ZONE_ID/dns_records" \
              -d "{\"type\":\"CNAME\",\"name\":\"$HOST\",\"content\":\"$PAGES_PROJECT.pages.dev\",\"proxied\":true}" \
              | jq -r '"dns cname: " + (.success|tostring)'
          else
            echo "dns cname: already exists"
          fi

          curl -fsS -H "$AUTH" \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains" \
            | jq -r '.result[] | "domain: \(.name) status=\(.status)"'
